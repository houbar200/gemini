<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">

    <title>Atlas Plemen 2026</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#080d14">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg:        #080d14;
            --surface:   #0f1923;
            --card:      #131f2e;
            --border:    rgba(255,255,255,0.07);
            --primary:   #4ade80;
            --primary2:  #22c55e;
            --gold:      #f5c842;
            --text:      #f0f4f8;
            --text-dim:  #64748b;
            --text-mid:  #94a3b8;
            --radius:    28px;
            --danger:    #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden; -webkit-user-select: none; user-select: none;
            padding: 16px;
        }

        body::before {
            content: ''; position: fixed; inset: 0;
            background-image: linear-gradient(rgba(74,222,128,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(74,222,128,0.025) 1px, transparent 1px);
            background-size: 48px 48px; pointer-events: none; z-index: 0;
        }

        body::after {
            content: ''; position: fixed; top: -20vh; left: 50%;
            transform: translateX(-50%); width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(74,222,128,0.07) 0%, transparent 70%);
            pointer-events: none; z-index: 0;
        }

        /* ──────────────── START SCREEN ──────────────── */
        .start-screen {
            position: fixed; inset: 0; background: var(--bg);
            z-index: 200; display: flex; flex-direction: column;
            align-items: center; padding: 40px 20px; overflow-y: auto;
        }
        .start-title {
            font-family: 'Playfair Display', serif; font-size: 2.8rem;
            color: var(--primary); margin-bottom: 5px; font-weight: 900;
        }
        .start-sub { color: var(--text-mid); margin-bottom: 30px; font-size: 0.95rem; text-align: center; }
        
        .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 440px; }
        .cat-btn {
            background: var(--surface); border: 1px solid var(--border);
            padding: 18px 12px; border-radius: 18px; color: var(--text);
            font-weight: 600; font-size: 1rem; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .cat-btn:active { transform: scale(0.96); }
        .cat-btn.all { grid-column: span 2; background: linear-gradient(135deg, var(--primary2), var(--primary)); color: #071a0f; border: none; box-shadow: 0 4px 20px rgba(74,222,128,0.2); }
        .cat-btn.review { grid-column: span 2; background: rgba(239, 68, 68, 0.1); border-color: var(--danger); color: var(--danger); margin-top: 10px; }
        .cat-btn.review[disabled] { opacity: 0.5; pointer-events: none; border-color: var(--border); color: var(--text-dim); background: transparent; }

        /* ──────────────── APP HEADER ──────────────── */
        .header {
            width: 100%; max-width: 440px; display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 14px; position: relative; z-index: 1;
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--text-mid); letter-spacing: 0.5px; cursor: pointer; }
        .logo span { color: var(--primary); }
        .progress-pill {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 100px; padding: 6px 14px; font-size: 0.78rem;
            font-weight: 600; color: var(--text-mid); letter-spacing: 0.5px;
        }

        /* ──────────────── PROGRESS BAR ──────────────── */
        .progress-track {
            width: 100%; max-width: 440px; height: 3px; background: var(--surface);
            border-radius: 4px; margin-bottom: 14px; overflow: hidden; position: relative; z-index: 1;
        }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary2), var(--primary)); border-radius: 4px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 0 8px rgba(74,222,128,0.5); }

        /* ──────────────── CARD ──────────────── */
        .card-wrap { width: 100%; max-width: 440px; position: relative; z-index: 1; perspective: 1000px; }
        .card {
            background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
            box-shadow: 0 0 0 1px rgba(74,222,128,0.04), 0 32px 64px -16px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            overflow: hidden; display: flex; flex-direction: column;
        }

        .img-wrap { position: relative; width: 100%; height: 270px; overflow: hidden; background: var(--surface); }
        .animal-img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.35s ease, transform 0.35s ease; display: block; }
        .animal-img.loading { opacity: 0; transform: scale(1.03); }
        .img-wrap::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 55%, var(--card) 100%); pointer-events: none; }

        .badge {
            position: absolute; top: 14px; left: 14px; background: rgba(8,13,20,0.75);
            backdrop-filter: blur(10px); border: 1px solid var(--border); border-radius: 100px;
            padding: 5px 12px; font-size: 0.75rem; font-weight: 600; color: var(--text-mid);
            letter-spacing: 0.5px; z-index: 2; display: flex; align-items: center; gap: 5px;
        }

        .card-body { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
        .answer-wrap { min-height: 64px; display: flex; align-items: center; justify-content: center; }
        .answer-hidden { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); border: 1px solid rgba(255,255,255,0.1); }
        .answer-text {
            font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700; color: var(--primary);
            text-align: center; line-height: 1.2; animation: fadeUp 0.4s cubic-bezier(0.4,0,0.2,1) both; display: none;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* ──────────────── BUTTONS ──────────────── */
        .btn-row { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 16px 10px; border: none; border-radius: 18px; font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.18s cubic-bezier(0.4,0,0.2,1);
            letter-spacing: 0.3px; position: relative; overflow: hidden;
        }
        .btn::after { content: ''; position: absolute; inset: 0; background: rgba(255,255,255,0); transition: background 0.15s; }
        .btn:active::after { background: rgba(255,255,255,0.08); }
        .btn:active { transform: scale(0.97); }

        .btn-reveal { background: transparent; color: var(--primary); border: 1.5px solid rgba(74,222,128,0.35); box-shadow: inset 0 0 20px rgba(74,222,128,0.04); }
        .btn-reveal:hover { border-color: var(--primary); box-shadow: 0 0 20px rgba(74,222,128,0.15), inset 0 0 20px rgba(74,222,128,0.06); }
        
        .btn-yes { background: linear-gradient(135deg, var(--primary2), var(--primary)); color: #071a0f; box-shadow: 0 4px 24px rgba(74,222,128,0.25); }
        .btn-no { background: transparent; border: 1.5px solid var(--danger); color: var(--danger); }

        .swipe-hint { text-align: center; font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.5px; margin-top: 2px; opacity: 0.7; }

        /* ──────────────── FINISH SCREEN ──────────────── */
        .finish-screen {
            display: none; position: fixed; inset: 0; background: var(--bg); z-index: 100;
            flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; text-align: center;
        }
        .finish-screen.visible { display: flex; }
        .finish-ring { width: 120px; height: 120px; position: relative; margin-bottom: 32px; }
        .finish-ring svg { width: 120px; height: 120px; transform: rotate(-90deg); }
        .finish-ring circle { fill: none; stroke-width: 4; stroke-linecap: round; }
        .ring-bg { stroke: rgba(255,255,255,0.05); }
        .ring-fill { stroke: var(--primary); stroke-dasharray: 326; stroke-dashoffset: 326; filter: drop-shadow(0 0 6px rgba(74,222,128,0.5)); transition: stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1) 0.3s; }
        .finish-ring .icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; }

        .finish-title { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; line-height: 1.15; margin-bottom: 10px; background: linear-gradient(135deg, #fff 40%, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .finish-sub { font-size: 1rem; color: var(--text-mid); margin-bottom: 40px; line-height: 1.5; }
        .finish-stats { display: flex; gap: 16px; margin-bottom: 40px; width: 100%; max-width: 320px; }
        .stat-box { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; }
        .stat-num { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 900; color: var(--primary); }
        .stat-num.err { color: var(--danger); }
        .stat-label { font-size: 0.75rem; color: var(--text-dim); font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; }

        @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .card-wrap.anim { animation: cardIn 0.4s cubic-bezier(0.4,0,0.2,1) both; }
        #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 99; }
    </style>
</head>

    </div>
</div>

    <div class="btn-row" style="width: 100%; max-width: 320px;">

    { file: "Sob polární.jpg", cat: "🌴", catName: "Exotika" }, { file: "Tapír jihoamerický.jpg", cat: "🌴", catName: "Exotika" },
    { file: "Tučňák královský.jpg", cat: "🐧", catName: "Exotika" }, { file: "Tygr indický.jpg", cat: "🌴", catName: "Exotika" },
    { file: "Varan komodský.jpg", cat: "🦎", catName: "Exotika" }, { file: "Velbloud dvouhrbý.jpg", cat: "🐪", catName: "Exotika" },
    { file: "Velbloud jednohrbý.jpg", cat: "🐪", catName: "Exotika" }, { file: "Vlk obecný.jpg", cat: "🌴", catName: "Exotika" },
    { file: "Zebra Grévyho.jpg", cat: "🦓", catName: "Exotika" }, { file: "Zmije rohatá.jpg", cat: "🐍", catName: "Exotika" },
    { file: "Želva sloní.jpg", cat: "🐢", catName: "Exotika" }
];

let allData = [];
let currentDeck = [];
let mistakes = new Set();
let roundMistakes = 0;
let currentIndex = 0;
let revealed = false;

// Dotyk pro swipe
let touchStartX = 0;
let touchStartY = 0;

// ─── INITIALIZATION ────────────────────────────────────────────────────────
function initApp() {
    // Příprava dat s magií pro FCI štítky
    allData = seznamSouboru.map(item => {
        let jmeno = item.file.substring(0, item.file.lastIndexOf('.'));
        let badgeText = `${item.cat} ${item.catName}`;

        const fciMatch = jmeno.match(/\s*\((FCI\s*\d+)\)/i);
        if (fciMatch) {
            badgeText = `🐕 ${fciMatch[1]}`;
            jmeno = jmeno.replace(fciMatch[0], '');
        }
        jmeno = jmeno.replace(',', ' / ');

        return { name: jmeno, img: item.file, badge: badgeText, catName: item.catName };
    });
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// ─── GAME LOGIC ────────────────────────────────────────────────────────────
function goToStart() {
    document.getElementById('finish-screen').classList.remove('visible');
    document.getElementById('start-screen').style.display = 'flex';
    document.getElementById('ring-fill').style.strokeDashoffset = '326';
    
    // Aktualizace tlačítka opakování
    const reviewBtn = document.getElementById('review-btn');
    document.getElementById('mistakes-badge').textContent = mistakes.size;
    if (mistakes.size > 0) reviewBtn.removeAttribute('disabled');
    else reviewBtn.setAttribute('disabled', 'true');
}

function startGame(category) {
    if (category === 'Vše') {
        currentDeck = [...allData];
    } else if (category === 'Opakování') {
        if (mistakes.size === 0) return;
        currentDeck = Array.from(mistakes);
        mistakes.clear(); // Vyprázdníme, co nezvládne teď, spadne tam znovu
    } else {
        currentDeck = allData.filter(a => a.catName === category);
    }
    
    shuffle(currentDeck);
    currentIndex = 0;
    roundMistakes = 0;
    
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('finish-screen').classList.remove('visible');
    updateCard();
}

function updateCard() {
    const animal = currentDeck[currentIndex];
    const imgEl = document.getElementById('animal-image');
    const wrapEl = document.getElementById('card-wrap');
    
    // Re-trigger animation
    wrapEl.classList.remove('anim');
    void wrapEl.offsetWidth;
    wrapEl.classList.add('anim');

    // Progress
    document.getElementById('progress-pill').textContent = `${currentIndex + 1} / ${currentDeck.length}`;
    document.getElementById('progress-fill').style.width = `${(currentIndex / currentDeck.length) * 100}%`;

    // Data karty
    document.getElementById('badge').textContent = animal.badge;

    // Načítání obrázku
    imgEl.classList.add('loading');
    const newSrc = animal.img;
    const tmp = new Image();
    tmp.onload = () => { imgEl.src = newSrc; imgEl.classList.remove('loading'); };
    tmp.onerror = () => { imgEl.src = newSrc; imgEl.classList.remove('loading'); };
    tmp.src = newSrc;

    // Tajenka a tečky
    document.getElementById('answer-text').style.display = 'none';
    document.getElementById('answer-text').textContent = animal.name;

    const dotsWrap = document.getElementById('dots-wrap');
    dotsWrap.style.display = 'flex';
    dotsWrap.innerHTML = '';
    const dotCount = Math.min(animal.name.replace(/ /g,'').length, 16);
    for (let i = 0; i < dotCount; i++) {
        const d = document.createElement('div'); d.className = 'dot';
        dotsWrap.appendChild(d);
    }

    // UI state
    document.getElementById('row-reveal').style.display = 'flex';
    document.getElementById('row-action').style.display = 'none';
    document.getElementById('swipe-hint').textContent = 'Swipe vlevo pro odhalení';
    revealed = false;
}

function reveal() {
    if (revealed) return;
    revealed = true;

    document.getElementById('dots-wrap').style.display = 'none';
    document.getElementById('answer-text').style.display = 'flex';

    document.getElementById('row-reveal').style.display = 'none';
    document.getElementById('row-action').style.display = 'flex';
    document.getElementById('swipe-hint').textContent = '⬅️ Nevím | Vím ➡️';

    if (navigator.vibrate) navigator.vibrate(40);
}

function nextQuestion(knewIt) {
    const animal = currentDeck[currentIndex];
    
    // Pokud nevěděl, uložíme do chyb
    if (!knewIt) {
        mistakes.add(animal);
        roundMistakes++;
    }

    currentIndex++;
    if (currentIndex >= currentDeck.length) {
        showFinish();
    } else {
        updateCard();
    }
}

function showFinish() {
    const correct = currentDeck.length - roundMistakes;
    document.getElementById('stat-total').textContent = correct;
    document.getElementById('stat-err').textContent = roundMistakes;

    // Povolení/zakázání tlačítka opakování na konci
    const revBtn = document.getElementById('finish-review-btn');
    if (mistakes.size > 0) revBtn.style.display = 'block';
    else revBtn.style.display = 'none';

    const fs = document.getElementById('finish-screen');
    fs.classList.add('visible');

    setTimeout(() => {
        const percent = correct / currentDeck.length;
        document.getElementById('ring-fill').style.strokeDashoffset = 326 - (326 * percent);
    }, 100);

    if (correct === currentDeck.length) launchConfetti();
    if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
}

// ─── SWIPE GESTURES ──────────────────────────────────────────────────────
document.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
}, { passive: true });

document.addEventListener('touchend', e => {
    // Zabrání swipu pokud je vidět start nebo finish screen
    if(document.getElementById('start-screen').style.display !== 'none' || 
       document.getElementById('finish-screen').classList.contains('visible')) return;

    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
        if (!revealed && dx < 0) {
            reveal(); // Doleva = odhalit
        } else if (revealed) {
            if (dx < 0) nextQuestion(false); // Doleva = Nevím
            if (dx > 0) nextQuestion(true);  // Doprava = Vím
        }
    }
}, { passive: true });

// ─── CONFETTI ────────────────────────────────────────────────────────────
function launchConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    const colors = ['#4ade80','#22c55e','#f5c842','#f8fafc','#86efac','#fbbf24'];
    const pieces = Array.from({ length: 80 }, () => ({
        x: Math.random() * canvas.width, y: -10 - Math.random() * 100,
        r: 4 + Math.random() * 6, color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3,
        spin: (Math.random() - 0.5) * 0.2, angle: Math.random() * Math.PI * 2,
        shape: Math.random() > 0.5 ? 'rect' : 'circle',
    }));

    let frame = 0;
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle); ctx.fillStyle = p.color;
            if (p.shape === 'rect') { ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); } 
            else { ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill(); }
            ctx.restore();
            p.x += p.vx; p.y += p.vy; p.angle += p.spin; p.vy += 0.05;
        });
        frame++;
        if (frame < 180) requestAnimationFrame(draw);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    draw();
}

// ─── BOOT ────────────────────────────────────────────────────────────────
initApp();
goToStart();
</script>
